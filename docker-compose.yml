# ==============================================================================
# CardCap - Local Supabase Development Stack (Docker Compose)
# Run: docker compose up -d
# Studio UI: http://localhost:54323
# API Gateway: http://localhost:54321
# Local Email Sandbox (Inbucket): http://localhost:54324
# ==============================================================================

version: '3.8'

services:
  # 1. PostgreSQL Database with Schema Initialization
  db:
    image: supabase/postgres:15.6.1.143
    container_name: ccr-supabase-db
    healthcheck:
      test: pg_isready -U postgres -h localhost
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "54322:5432"
    environment:
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: postgres
    volumes:
      - ./supabase/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ccr_pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  # 2. Inbucket - Local Email Testing Server (Captures Sign-up & Magic Link Emails)
  inbucket:
    image: inbucket/inbucket:3.0.0-rc2
    container_name: ccr-supabase-inbucket
    ports:
      - "54324:9000" # Web UI
      - "2500:2500"  # SMTP
    restart: unless-stopped

volumes:
  ccr_pg_data:
